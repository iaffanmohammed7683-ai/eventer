<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Space Grotesk',sans-serif;background:#0f0c29;color:#f0f0f5;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .bg-grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(233,69,96,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(233,69,96,.04) 1px,transparent 1px);background-size:60px 60px}
    .box{position:relative;z-index:1;background:rgba(22,33,62,.8);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:48px 40px;width:100%;max-width:400px;backdrop-filter:blur(16px)}
    .logo{text-align:center;margin-bottom:32px}
    .logo-icon{width:56px;height:56px;background:linear-gradient(135deg,#e94560,#c0392b);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 12px}
    h2{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;text-align:center;margin-bottom:4px}
    .sub{color:#8a8fa8;font-size:13px;text-align:center;margin-bottom:32px}
    .field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
    label{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#8a8fa8}
    input{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:14px 16px;color:#f0f0f5;font-family:'Space Grotesk',sans-serif;font-size:15px;outline:none;width:100%;transition:all .2s}
    input:focus{border-color:#e94560;background:rgba(233,69,96,.08);box-shadow:0 0 0 3px rgba(233,69,96,.12)}
    .btn{width:100%;padding:16px;background:linear-gradient(135deg,#e94560,#c0392b);border:none;border-radius:12px;color:#fff;font-family:'Syne',sans-serif;font-size:17px;font-weight:700;cursor:pointer;transition:all .25s;margin-top:8px}
    .btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(233,69,96,.4)}
    .error{background:rgba(233,69,96,.12);border:1px solid rgba(233,69,96,.3);border-radius:10px;padding:12px 16px;font-size:13px;color:#e94560;margin-bottom:16px;text-align:center}
  </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="box">
  <div class="logo">
    <div class="logo-icon">🔐</div>
    <h2>Admin Panel</h2>
    <p class="sub">Event Registration Management</p>
  </div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST">
    <div class="field"><label>Username</label><input type="text" name="username" placeholder="admin" required/></div>
    <div class="field"><label>Password</label><input type="password" name="password" placeholder="••••••••" required/></div>
    <button class="btn" type="submit">Login →</button>
  </form>
</div>
</body>
</html>
